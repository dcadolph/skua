<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Skua</title>
<meta property="og:title" content="Skua">
<meta property="og:type" content="website">
<link rel="icon" href="skua-logo.png">
<link rel="apple-touch-icon" href="skua-logo.png">
<style>
  :root {
    --bg: #060709;
    --bg-glow: #0c0d10;
    --fg: #eef1f4;
    --bolt: #ff7f32;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7;
      --bg-glow: #ffffff;
      --fg: #17181c;
      --bolt: #e4671c;
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--bg);
    background-image: radial-gradient(ellipse 90% 60% at 50% 0%, var(--bg-glow), var(--bg) 70%);
    color: var(--fg);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    text-align: center;
    animation: rise 1.1s cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }

  img {
    width: min(180px, 42vw);
    height: auto;
    display: block;
  }

  p {
    margin: 0;
    font-size: clamp(1.15rem, 1rem + 1.1vw, 1.6rem);
    font-weight: 400;
    letter-spacing: 0.01em;
    line-height: 1.5;
    max-width: 22ch;
    text-wrap: balance;
  }

  .mark {
    display: block;
    width: 2rem;
    height: 2px;
    border-radius: 2px;
    background: var(--bolt);
    opacity: 0.85;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <img src="skua-logo.png" alt="Skua">
    <span class="mark"></span>
    <p>Forgot my umbrella. Be there shortly.</p>
  </main>
</body>
</html>
