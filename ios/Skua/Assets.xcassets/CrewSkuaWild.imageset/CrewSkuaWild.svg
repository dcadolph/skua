<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- flying singles -->
  <g>
    <rect x="50" y="70" width="70" height="34" rx="3" fill="#7BC67B" stroke="#3E8E3E" stroke-width="3" transform="rotate(-18 85 87)"/>
    <text x="72" y="95" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#2F6F2F" transform="rotate(-18 85 87)">1</text>
    <rect x="410" y="50" width="70" height="34" rx="3" fill="#7BC67B" stroke="#3E8E3E" stroke-width="3" transform="rotate(22 445 67)"/>
    <text x="438" y="75" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#2F6F2F" transform="rotate(22 445 67)">1</text>
    <rect x="40" y="420" width="70" height="34" rx="3" fill="#7BC67B" stroke="#3E8E3E" stroke-width="3" transform="rotate(12 75 437)"/>
    <text x="62" y="445" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#2F6F2F" transform="rotate(12 75 437)">1</text>
  </g>
  <!-- tail -->
  <path d="M150 330 L70 300 L85 340 L60 370 L150 360 Z" fill="#4E3626"/>
  <!-- body -->
  <ellipse cx="250" cy="320" rx="125" ry="112" fill="#6B4A35"/>
  <ellipse cx="275" cy="345" rx="80" ry="72" fill="#C9A27E"/>
  <!-- back wing -->
  <ellipse cx="190" cy="315" rx="58" ry="88" transform="rotate(-25 190 315)" fill="#553A28"/>
  <path d="M150 360 Q170 395 205 400" stroke="#3E2A1D" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- legs -->
  <path d="M235 425 L230 462 M290 425 L295 462" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <path d="M205 468 L230 456 L255 468 Z M270 468 L295 456 L320 468 Z" fill="#222" stroke="#222" stroke-width="6" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="300" cy="185" r="80" fill="#6B4A35"/>
  <ellipse cx="335" cy="215" rx="34" ry="22" fill="#F28CA0" opacity="0.55"/>
  <!-- beak -->
  <path d="M362 180 L428 192 Q442 202 428 216 L420 208 Q400 214 365 210 Z" fill="#2A2A2A"/>
  <path d="M366 196 L420 200" stroke="#555" stroke-width="3"/>
  <!-- heart boxers -->
  <path d="M170 370 Q250 350 340 375 L335 425 L300 428 L270 400 L240 428 L200 425 Z" fill="#E8EDF5"/>
  <g fill="#FF3E6C">
    <path d="M215 390 C215 383 224 382 226 389 C228 382 237 383 237 390 C237 397 226 403 226 405 C226 403 215 397 215 390 Z"/>
    <path d="M285 385 C285 378 294 377 296 384 C298 377 307 378 307 385 C307 392 296 398 296 400 C296 398 285 392 285 385 Z"/>
    <path d="M250 412 C250 405 259 404 261 411 C263 404 272 405 272 412 C272 419 261 425 261 427 C261 425 250 419 250 412 Z"/>
  </g>
  <!-- necktie as a headband -->
  <path d="M225 140 Q300 110 375 140 L372 154 Q300 126 228 154 Z" fill="#D7263D"/>
  <path d="M228 150 L195 175 L205 190 L238 158 Z" fill="#D7263D"/>
  <path d="M232 152 L200 200 L214 208 L240 160 Z" fill="#B71C30"/>
  <!-- dazed eyes -->
  <path d="M300 160 L326 184 M326 160 L300 184" stroke="#1B1B1B" stroke-width="6" stroke-linecap="round"/>
  <!-- big grin -->
  <path d="M368 214 Q392 236 418 214" stroke="#1B1B1B" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- front wing fanning singles -->
  <path d="M330 300 Q395 290 410 245 Q420 262 405 300 Q380 335 330 335 Z" fill="#553A28"/>
  <g transform="translate(400 250)">
    <rect x="-10" y="-45" width="34" height="62" rx="3" fill="#7BC67B" stroke="#3E8E3E" stroke-width="3" transform="rotate(-30)"/>
    <rect x="-10" y="-50" width="34" height="62" rx="3" fill="#7BC67B" stroke="#3E8E3E" stroke-width="3" transform="rotate(-8)"/>
    <rect x="-10" y="-50" width="34" height="62" rx="3" fill="#86D486" stroke="#3E8E3E" stroke-width="3" transform="rotate(16)"/>
  </g>
  <!-- beer in the other wing -->
  <rect x="120" y="230" width="38" height="64" rx="6" fill="#F2B233" stroke="#FFFFFF" stroke-width="3" transform="rotate(-15 139 262)"/>
  <path d="M118 232 Q126 214 138 224 Q148 210 160 228 Z" fill="#FFFFFF" transform="rotate(-15 139 262)"/>
</svg>
