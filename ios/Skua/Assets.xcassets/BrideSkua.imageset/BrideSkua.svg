  <path d="M304 166 Q320 184 338 166" stroke="#1B1B1B" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M336 166 L346 158" stroke="#1B1B1B" stroke-width="4" stroke-linecap="round"/>
  <!-- tiara -->
  <path d="M245 118 L258 88 L272 110 L290 78 L306 108 L322 86 L332 116 Q290 104 245 118 Z" fill="#F5C84C" stroke="#C9971E" stroke-width="3"/>
  <circle cx="290" cy="80" r="7" fill="#FF3E9E"/>
  <!-- sash -->
  <path d="M175 250 L205 230 L355 400 L325 420 Z" fill="#FF3E9E"/>
  <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" transform="translate(212 268) rotate(48)" letter-spacing="2">BRIDE</text>
  <!-- front wing raising a coupe -->
  <path d="M330 300 Q395 290 410 245 Q420 262 405 300 Q380 335 330 335 Z" fill="#553A28"/>
  <path d="M385 200 Q420 230 455 200 Z" fill="#FCE9A8" stroke="#E0B84C" stroke-width="3"/>
  <path d="M420 223 L420 262 M402 264 L438 264" stroke="#E0B84C" stroke-width="4" stroke-linecap="round"/>
  <circle cx="412" cy="185" r="5" fill="#FCE9A8"/><circle cx="430" cy="170" r="4" fill="#FCE9A8"/><circle cx="420" cy="152" r="6" fill="#FCE9A8"/>
  <!-- sparkles -->
  <path d="M100 120 L106 135 L121 141 L106 147 L100 162 L94 147 L79 141 L94 135 Z" fill="#F5C84C"/>
  <path d="M440 100 L444 110 L454 114 L444 118 L440 128 L436 118 L426 114 L436 110 Z" fill="#FF8CC6"/>
