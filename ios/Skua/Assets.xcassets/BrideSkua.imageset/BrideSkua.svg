<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- veil -->
  <path d="M270 112 Q190 120 150 210 Q120 300 95 380 Q150 340 200 330 Q215 230 270 150 Z" fill="#FFFFFF" opacity="0.55"/>
