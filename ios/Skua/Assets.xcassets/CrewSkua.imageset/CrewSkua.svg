  <path d="M232 145 Q240 92 300 100 Q350 104 365 140 Q300 120 232 145 Z" fill="#2D7FF9"/>
  <path d="M232 145 Q205 150 192 132 Q215 125 240 132 Z" fill="#1D5FC4"/>
