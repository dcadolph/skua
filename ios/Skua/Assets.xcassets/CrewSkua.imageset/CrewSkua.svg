  <rect x="398" y="215" width="42" height="72" rx="6" fill="#F2B233" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M396 215 Q405 196 418 208 Q428 192 442 214 Z" fill="#FFFFFF"/>
  <path d="M440 232 Q462 236 460 254 Q458 270 440 270" stroke="#FFFFFF" stroke-width="6" fill="none"/>
