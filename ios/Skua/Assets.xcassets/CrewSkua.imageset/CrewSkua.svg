  <circle cx="447" cy="225" r="5" fill="#FF7A1A"/>
  <path d="M452 215 Q445 195 460 182 Q475 168 465 148" stroke="#BBBBBB" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- bow tie -->
  <path d="M268 262 L240 248 L240 280 Z M268 262 L296 248 L296 280 Z" fill="#111"/>
  <circle cx="268" cy="264" r="7" fill="#333"/>
