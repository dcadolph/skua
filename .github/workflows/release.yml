name: release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          bin=skua
          [ "$GOOS" = "windows" ] && bin=skua.exe
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/$bin" .
          archive="skua_${TAG}_${GOOS}_${GOARCH}"
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip "$archive.zip" "$bin"
          else
            tar czf "$archive.tar.gz" "$bin"
          fi
          rm -f "$bin"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
