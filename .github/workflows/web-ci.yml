name: web-ci
on:
  push:
    branches: [main]
    paths: ['web/**']
  pull_request:
    paths: ['web/**']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - run: npm run build
